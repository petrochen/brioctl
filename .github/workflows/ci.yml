name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: make
      - name: Test
        run: make test
      - name: Universal build
        run: make universal
      - name: Check architectures
        run: |
          lipo -info brioctl
          lipo -info brioctl | grep -q arm64
          lipo -info brioctl | grep -q x86_64

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Build the release tarball
        run: |
          version="${GITHUB_REF_NAME#v}"
          make dist VERSION="$version"
          tar -tzf "brioctl-$version-macos-universal.tar.gz"
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Release notes: the CHANGELOG.md section of this version.
          awk -v v="$version" '/^## /{ p = (index($0, "## " v " ") == 1); next } p' CHANGELOG.md > notes.md
          if [ -s notes.md ]; then
            gh release create "$GITHUB_REF_NAME" "brioctl-$version-macos-universal.tar.gz" \
              --title "brioctl $version" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" "brioctl-$version-macos-universal.tar.gz" \
              --title "brioctl $version" --generate-notes
          fi
